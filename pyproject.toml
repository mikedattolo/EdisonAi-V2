[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edison-ai-v2"
version = "0.1.0"
description = "Local-first modular AI workstation foundation for EDISON V2."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.30,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0"
]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["edison_core*"]
